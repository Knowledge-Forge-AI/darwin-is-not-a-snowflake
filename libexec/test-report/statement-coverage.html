<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ language }} Statement Coverage</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; line-height: 1.4; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #c7c7c7; padding: 0.45rem 0.55rem; text-align: left; }
    th { background: #eeeeee; }
    .covered { color: #0a6d1d; font-weight: 600; }
    .missed { color: #a40000; font-weight: 600; }
  </style>
</head>
<body>
  <h1>{{ language }} Statement Coverage</h1>
  <table>
    <thead><tr><th>Target</th><th>Status</th><th>Covered Statements</th><th>Total Statements</th></tr></thead>
    <tbody>
{{ rows }}
    </tbody>
  </table>
</body>
</html>
