# Managed by nix-darwin.

# Match the exported macOS Terminal "Basic" profile as closely as kitty allows.
font_family JetBrainsMono Nerd Font
font_size 12.0

foreground #33ff00
background #000000
cursor #33ff00
selection_background #314f78
selection_foreground #ffffff

cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
shell_integration no-cursor

initial_window_width 90c
initial_window_height 30c
remember_window_size no
window_padding_width 8
background_opacity 1.0
macos_titlebar_color background
tab_bar_style hidden
enable_audio_bell no

# Shell selection is handled by the managed Kitty Bash and Kitty Zsh launchers.
