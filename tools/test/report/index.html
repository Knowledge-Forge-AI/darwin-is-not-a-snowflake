<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>nix-darwin Test Results</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; line-height: 1.4; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0 2rem; }
    th, td { border: 1px solid #c7c7c7; padding: 0.45rem 0.55rem; text-align: left; vertical-align: top; }
    th { background: #eeeeee; }
    .passed { color: #0a6d1d; font-weight: 600; }
    .failed { color: #a40000; font-weight: 600; }
    .skipped { color: #876000; font-weight: 600; }
    details { max-width: 70rem; }
    pre { white-space: pre-wrap; background: #f6f6f6; padding: 0.75rem; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>nix-darwin Test Results</h1>
  <p>Total: {{ total }} | Passed: {{ passed }} | Failed: {{ failed }} | Skipped: {{ skipped }}</p>
  <h2>Coverage</h2>
  <ul>{{ coverage_items }}</ul>
  <h2>Suites</h2>
  <table>
    <thead><tr><th>Scope</th><th>Language</th><th>Module</th><th>Total</th><th>Passed</th><th>Failed</th><th>Skipped</th></tr></thead>
    <tbody>{{ suite_rows }}</tbody>
  </table>
  <h2>Tests</h2>
  <table>
    <thead><tr><th>Status</th><th>Scope</th><th>Language</th><th>Class/Module</th><th>Test</th><th>Output</th></tr></thead>
    <tbody>{{ test_rows }}</tbody>
  </table>
</body>
</html>
